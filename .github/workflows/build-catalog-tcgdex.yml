name: build-catalog-tcgdex

# Gemello di build-catalog.yml, ma con i dati di TCGdex e su un tag SEPARATO.
# Finche' resta cosi', la release "catalog" che l'app usa davvero non viene
# toccata: si puo' generare, scaricare e confrontare il bundle nuovo senza
# rischiare di rompere le installazioni esistenti.
#
#   https://github.com/<owner>/<repo>/releases/download/catalog-tcgdex/manifest.json
#   https://github.com/<owner>/<repo>/releases/download/catalog-tcgdex/catalog.json.gz
#
# Sulla stessa release convivono i cataloghi di piu' lingue, uno per asset:
# l'inglese senza suffisso (e' quello che le app gia' installate cercano), le
# altre con il codice lingua in coda.
#
#   manifest-ja.json / catalog-ja.json.gz   ->  carte giapponesi
#
# Non sono traduzioni l'uno dell'altro: le carte giapponesi escono in espansioni
# loro e numerate a modo loro, quindi l'app li tiene in due database separati e
# scarica il secondo solo a chi lo chiede.
#
# Quando il bundle nuovo convince, il passaggio definitivo e' cambiare TAG qui
# e in CatalogConfig.kt (e togliere il workflow vecchio).
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Immagine TCGdex da cui prendere i dati"
        default: "tcgdex/server:edge"
      langs:
        description: "Lingue da generare, separate da spazio"
        default: "en ja"
      name_langs:
        description: "Lingue di cui aggiungere i nomi al catalogo occidentale"
        default: "it"
      publish:
        description: "Carica gli asset sulla release (togli la spunta per solo misurare)"
        type: boolean
        default: true
  schedule:
    # Ogni lunedi' alle 05:30 UTC, mezz'ora dopo il workflow storico cosi' i
    # due non si contendono il runner.
    - cron: "30 5 * * 1"

permissions:
  contents: write

env:
  TAG: catalog-tcgdex
  # Tutte le lingue pubblicate: il giro settimanale le rigenera tutte, perche' un
  # catalogo giapponese fermo a sei mesi fa e' un problema di chi lo ha scaricato
  # esattamente quanto lo sarebbe quello occidentale.
  LANGS: ${{ inputs.langs || 'en ja' }}
  # Le lingue che NON diventano un catalogo a se' ma i cui nomi entrano in quello
  # occidentale: sono le stesse carte, stampate altrove. Servono a riconoscere una
  # carta che in mano non e' in inglese — "Cyndaquil di Armonio" contro "Ethan's
  # Cyndaquil" — e costano solo i nomi che differiscono davvero.
  NAME_LANGS: ${{ inputs.name_langs || 'it' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout di questo repo
        uses: actions/checkout@v4

      # I dati sono gia' compilati dentro l'immagine (il loro build.yml esegue
      # `bun run compile` prima del docker build), quindi non serve avviare il
      # server ne' interrogare l'API pubblica: si estrae la cartella e basta.
      - name: Estrai i dati da TCGdex
        env:
          IMAGE: ${{ inputs.image || 'tcgdex/server:edge' }}
        run: |
          set -eu
          docker pull "$IMAGE"
          echo "digest: $(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"

          cid=$(docker create "$IMAGE")
          docker export "$cid" -o image.tar
          docker rm "$cid" >/dev/null

          # Percorso noto ma non garantito dal progetto TCGdex: se un giorno lo
          # spostano vogliamo un errore chiaro qui, non un bundle vuoto pubblicato.
          tar -tf image.tar > listing.txt
          root=$(grep -E '(^|/)generated/$' listing.txt | head -n 1)
          if [ -z "$root" ]; then
            echo "::error::Nessuna cartella 'generated' nell'immagine $IMAGE."
            echo "::error::I dati non sono piu' precompilati: serve il fallback"
            echo "::error::con checkout di tcgdex/cards-database e 'bun run compile'."
            exit 1
          fi
          root="${root%/}"

          # Ogni lingua nella sua cartella: i due file si chiamano uguale, e in
          # una cartella sola il secondo cancellerebbe il primo.
          #
          # Si estraggono anche le lingue che un catalogo loro non lo avranno
          # ($NAME_LANGS): di quelle serve il solo cards.json, da cui si prendono
          # i nomi. `sort -u` perche' una lingua puo' stare in tutte e due gli
          # elenchi ed estrarla due volte sarebbe lavoro sprecato.
          for lang in $(printf '%s\n' $LANGS $NAME_LANGS | sort -u); do
            if ! tar -xf image.tar --wildcards "$root/$lang/*"; then
              echo "::error::Lingua '$lang' assente dall'immagine $IMAGE."
              exit 1
            fi
            mkdir -p "source/$lang"
            cp "$root/$lang/cards.json" "source/$lang/"
            # I set servono solo a chi diventa un catalogo: per le lingue dei
            # soli nomi il file puo' anche non esserci.
            if [ -f "$root/$lang/sets.json" ]; then
              cp "$root/$lang/sets.json" "source/$lang/"
            fi
          done
          rm -f image.tar
          ls -la source/*

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gli id Cardmarket/TCGplayer stanno nei dati compilati anche se l'API
      # pubblica non li restituisce: il compilatore di TCGdex li conserva in
      # `variants_detailed[].thirdParty` (e in `thirdParty` a livello di carta).
      # Sono la chiave con cui i prezzi si agganciano alla carta, quindi il
      # giorno in cui i prezzi servissero, questa e' la misura che dice se la
      # strada esiste ancora. Non e' un requisito del bundle: se la copertura
      # crolla o va a zero il workflow prosegue, ma il log lo dice.
      - name: Misura la copertura degli id di terze parti
        run: |
          set -eu
          for lang in $LANGS; do
            python - "source/$lang/cards.json" "$lang" <<'PY'
          import json, sys

          percorso, lingua = sys.argv[1], sys.argv[2]
          carte = json.load(open(percorso, encoding="utf-8"))

          def id_cardmarket(carta):
              """Gli id Cardmarket della carta: quello suo e quelli delle varianti."""
              trovati = set()
              for fonte in [carta.get("thirdParty")] + [
                  v.get("thirdParty") for v in carta.get("variants_detailed") or []
              ]:
                  if isinstance(fonte, dict) and isinstance(fonte.get("cardmarket"), int):
                      trovati.add(fonte["cardmarket"])
              return trovati

          totale = max(len(carte), 1)
          con_id = [c for c in carte if id_cardmarket(c)]
          distinti = len({i for c in con_id for i in id_cardmarket(c)})
          print(
              f"{lingua}: {len(con_id)}/{len(carte)} carte con un id Cardmarket "
              f"({len(con_id) * 100 / totale:.0f}%), {distinti} id distinti"
          )
          if not con_id:
              print(f"::warning::{lingua}: nessun id Cardmarket nei dati compilati.")
          PY
          done

      # --fill-images cerca sul CDN le immagini che i dati non dichiarano: sono
      # ~1.700 richieste HEAD per lingua, un paio di minuti. Senza, quelle carte
      # restano senza anteprima anche quando il file esiste.
      - name: Genera i bundle
        run: |
          set -eu
          # I nomi tradotti vanno nel solo catalogo occidentale: quello
          # giapponese e' fatto di carte diverse, con nomi loro, e un nome
          # italiano li' dentro non corrisponderebbe a niente.
          names=$(printf '%s' "$NAME_LANGS" | tr ' ' ',')
          for lang in $LANGS; do
            echo "::group::$lang"
            if [ "$lang" = "en" ] && [ -n "$names" ]; then
              python build_catalog_tcgdex.py \
                --source "source/$lang" --output dist \
                --lang "$lang" --fill-images --names "$names"
            else
              python build_catalog_tcgdex.py \
                --source "source/$lang" --output dist \
                --lang "$lang" --fill-images
            fi
            echo "::endgroup::"
          done
          ls -la dist

      # L'elenco delle carte senza illustrazione, lingua per lingua. Non va sulla
      # release — non e' catalogo, e' una misura — ma serve a segnalare i buchi a
      # chi i dati li mantiene: distingue le immagini che esistono sul CDN e che
      # i dati non dichiarano (si chiudono senza scansionare niente) da quelle
      # che mancano davvero.
      - name: Conserva il rapporto sulle immagini
        uses: actions/upload-artifact@v4
        with:
          name: immagini-mancanti
          path: dist/immagini-mancanti*.json
          retention-days: 30

      # Il confronto e la pubblicazione sono per lingua: un catalogo puo' essere
      # cambiato e l'altro no, e ripubblicare un asset identico vorrebbe dire
      # far riscaricare decine di MB a chi ce l'ha gia' uguale.
      # Si puo' generare senza pubblicare, e serve quando lo schema del bundle e'
      # cambiato: un catalogo di schema piu' alto di quello che l'app conosce
      # viene rifiutato, quindi finche' la versione nuova non e' in giro il
      # bundle si vuole misurare, non mettere online. Il giro settimanale non ha
      # input e pubblica sempre, come ha sempre fatto.
      - name: Pubblica gli asset cambiati
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hash_of() {
            python -c "import json,sys;print(json.load(open(sys.argv[1]))['contentHash'])" "$1"
          }

          to_upload=""
          for lang in $LANGS; do
            if [ "$lang" = "en" ]; then suffix=""; else suffix="-$lang"; fi
            manifest="manifest${suffix}.json"
            bundle="catalog${suffix}.json.gz"

            new_hash=$(hash_of "dist/$manifest")
            old_hash=""
            rm -rf current
            if gh release download "$TAG" --pattern "$manifest" --dir current 2>/dev/null; then
              old_hash=$(hash_of "current/$manifest")
            fi

            if [ "$new_hash" = "$old_hash" ]; then
              echo "$lang: dati invariati (hash $new_hash), non si pubblica."
            else
              echo "$lang: dati cambiati ($old_hash -> $new_hash)."
              to_upload="$to_upload dist/$bundle dist/$manifest"
            fi
          done

          if [ -z "$to_upload" ]; then
            echo "Niente da pubblicare."
            exit 0
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Catalogo carte (TCGdex, in prova)" \
              --prerelease \
              --notes "Bundle generato da build-catalog-tcgdex a partire dai dati TCGdex. Tag separato da 'catalog': serve a confrontare le due sorgenti prima di passare l'app alla nuova."
          fi
          # shellcheck disable=SC2086
          gh release upload "$TAG" $to_upload --clobber
