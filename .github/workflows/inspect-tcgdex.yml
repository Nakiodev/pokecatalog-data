name: inspect-tcgdex

# Workflow USA-E-GETTA. Guarda cosa c'e' dentro l'immagine ufficiale di TCGdex
# (tcgdex/server) per decidere se il catalogo puo' essere generato da li'
# invece che da PokemonTCG/pokemon-tcg-data.
#
# Non genera bundle, non tocca la release "catalog", non pubblica niente:
# scrive solo nel log e in un artifact temporaneo. Da cancellare dopo l'uso.
#
# Dal primo run sappiamo gia' che l'albero compilato sta in
#   usr/src/app/generated/<lingua>/{cards,sets,series,stats}.json
# quindi qui non si esplora piu': si va dritti a rispondere alle due domande
# rimaste, cioe' se cards.json contiene le carte COMPLETE (con `rarity` e
# `category`, che l'API pubblica non espone nelle liste) e se c'e' il set `mep`.
#
# Nota: niente `pipefail` in questi step. Le pipe che finiscono in `head`
# ricevono SIGPIPE per costruzione, e con pipefail un output troncato di
# proposito verrebbe letto come errore (era il motivo del run rosso).
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Immagine da ispezionare"
        default: "tcgdex/server:edge"
      lang:
        description: "Lingua da campionare"
        default: "en"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica l'immagine
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -eu
          docker pull "$IMAGE"
          echo "== digest (da pinnare se adottiamo questa strada) =="
          docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE"

      # `docker export` invece di entrare nel container: non serve che
      # l'immagine contenga una shell.
      - name: Estrai l'albero generato
        env:
          IMAGE: ${{ inputs.image }}
          LANG_CODE: ${{ inputs.lang }}
        run: |
          set -eu
          cid=$(docker create "$IMAGE")
          docker export "$cid" -o image.tar
          docker rm "$cid" >/dev/null

          # Il listato va su file: cosi' grep/head lavorano su un file e non
          # su una pipe che qualcuno chiude in anticipo.
          tar -tf image.tar > listing.txt
          echo "== file dentro generated/ =="
          grep -E 'generated/.*\.json$' listing.txt | head -n 60

          root=$(grep -E '(^|/)generated/$' listing.txt | head -n 1)
          if [ -z "$root" ]; then
            echo "Nessuna cartella 'generated': i dati NON sono precompilati"
            echo "nell'immagine. Si va sul fallback: bun run compile da checkout."
            exit 1
          fi
          root="${root%/}"
          echo "ROOT=$root" >> "$GITHUB_ENV"

          tar -xf image.tar --wildcards "$root/$LANG_CODE/*"
          echo "== dimensione dei file estratti =="
          ls -la "$root/$LANG_CODE"

      - name: Rispondi alle domande aperte
        env:
          LANG_CODE: ${{ inputs.lang }}
        run: |
          set -eu
          mkdir -p samples
          python3 - <<'PY'
          import collections, json, os

          base = os.path.join(os.environ["ROOT"], os.environ["LANG_CODE"])
          load = lambda n: json.load(open(os.path.join(base, n), encoding="utf-8"))
          dump = lambda o: json.dumps(o, ensure_ascii=False, indent=2)

          sets = load("sets.json")
          print(f"== SET: {len(sets)} ==")
          print("chiavi del primo set:", sorted(sets[0]))
          mep = next((s for s in sets if s.get("id") == "mep"), None)
          print("\n== il set mep ==")
          print(dump(mep) if mep else "ASSENTE")

          cards = load("cards.json")
          print(f"\n== CARTE: {len(cards)} ==")

          # La domanda vera: quali campi ci sono davvero, e su quante carte.
          # Se `rarity`/`category` mancano, cards.json e' solo un indice
          # "brief" e questa strada non basta.
          freq = collections.Counter(k for c in cards for k in c)
          print("\n== campi presenti (campo: su quante carte) ==")
          for k, n in freq.most_common():
              print(f"  {k}: {n}")

          print("\n== una carta qualsiasi ==")
          print(dump(cards[0]))

          mep_cards = [c for c in cards if str(c.get("id", "")).startswith("mep-")]
          print(f"\n== carte del set mep: {len(mep_cards)} ==")
          if mep_cards:
              print(dump(mep_cards[0]))

          # Campioni leggeri per l'artifact: cards.json intero sarebbe enorme.
          json.dump(cards[:50], open("samples/cards-primi-50.json", "w"), ensure_ascii=False, indent=2)
          json.dump(mep_cards, open("samples/cards-mep.json", "w"), ensure_ascii=False, indent=2)
          json.dump(sets, open("samples/sets.json", "w"), ensure_ascii=False, indent=2)
          PY

      - name: Carica i campioni
        uses: actions/upload-artifact@v4
        with:
          name: tcgdex-samples
          path: samples/
          retention-days: 7
